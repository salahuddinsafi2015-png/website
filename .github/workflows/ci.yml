name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Laravel API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, gd, zip, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  web:
    name: Next.js lint and build
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The build prerenders pages from the API, so a real (seeded) API runs
      # during the build rather than being mocked.
      - name: Set up PHP for the API
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, gd, zip, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install API dependencies
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/ci.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/ci.sqlite" \
            php artisan migrate --force --seed

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and build
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: |
          (cd ../api && DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/ci.sqlite" \
            php artisan serve --host=127.0.0.1 --port=8000 > /tmp/api.log 2>&1 &)

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/api.log; exit 1; fi

          npm run lint
          npm run build
